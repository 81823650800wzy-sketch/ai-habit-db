<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit DB</title>
    <link rel="stylesheet" href="styles/popup.css">
</head>
<body>
    <div class="popup-container" id="popupContainer">
        <!-- 拖动区域 -->
        <div class="drag-region"></div>

        <!-- 按钮区 -->
        <div class="top-buttons">
            <button class="icon-btn" onclick="openDashboard()" title="数据分析">📊</button>
            <button class="icon-btn" onclick="toggleSettings()" title="设置">⚙️</button>
        </div>

        <!-- 搜索 -->
        <div class="search-section">
            <input type="text" id="searchInput" class="search-input" placeholder="搜索..." autofocus>
        </div>

        <!-- 导航 -->
        <div class="nav-section">
            <button class="nav-item active" data-category="all">全部</button>
            <button class="nav-item" data-category="clipboard">📋 <span id="cCount">0</span></button>
            <button class="nav-item" data-category="files">📁 <span id="fCount">0</span></button>
            <button class="nav-item" data-category="snippets">💻 <span id="sCount">0</span></button>
            <button class="nav-item" data-category="projects">📂 <span id="pCount">0</span></button>
            <button class="nav-item" data-category="tools">🖥️ <span id="tCount">0</span></button>
        </div>

        <!-- 内容 -->
        <div class="content-section" id="contentSection">
            <div class="loading">加载中...</div>
        </div>

        <!-- 底部 -->
        <div class="footer-section">
            <span id="footerStatus">就绪</span>
            <span id="footerCount">0 条</span>
        </div>

        <!-- 设置面板 -->
        <div class="panel" id="settingsPanel">
            <div class="panel-header">
                <span>设置</span>
                <button class="close-btn" onclick="toggleSettings()">✕</button>
            </div>
            <div class="panel-content">
                <div class="setting-group">
                    <h4>采集模块</h4>
                    <label><input type="checkbox" id="mClipboard" onchange="toggleModule('clipboard')"> 剪切板</label>
                    <label><input type="checkbox" id="mAppUsage" onchange="toggleModule('appUsage')"> 应用时长</label>
                    <label><input type="checkbox" id="mWindow" onchange="toggleModule('windowTracking')"> 窗口跟踪</label>
                </div>
                <div class="setting-group">
                    <h4>操作权限</h4>
                    <label><input type="checkbox" id="pFiles" checked> 打开文件</label>
                    <label><input type="checkbox" id="pUrls" checked> 打开链接</label>
                    <label><input type="checkbox" id="pApps" checked> 启动应用</label>
                    <label><input type="checkbox" id="pPaste" checked> 自动粘贴</label>
                </div>
                <div class="setting-group">
                    <h4>启动</h4>
                    <label><input type="checkbox" id="autoStart" onchange="toggleAutoStart()"> 开机自启</label>
                </div>
            </div>
        </div>

        <!-- 数据分析面板 -->
        <div class="panel" id="dashboardPanel">
            <div class="panel-header">
                <span>📊 数据分析</span>
                <button class="close-btn" onclick="toggleDashboard()">✕</button>
            </div>
            <div class="panel-content">
                <div class="stats-grid">
                    <div class="stat-card"><div class="stat-num" id="dClip">0</div><div class="stat-label">剪切板</div></div>
                    <div class="stat-card"><div class="stat-num" id="dWin">0</div><div class="stat-label">窗口</div></div>
                    <div class="stat-card"><div class="stat-num" id="dApp">0</div><div class="stat-label">应用</div></div>
                </div>
                <div class="setting-group">
                    <h4>🤖 AI 分析</h4>
                    <select id="aiProvider" onchange="updateApiUrl()">
                        <option value="openai">OpenAI</option>
                        <option value="anthropic">Anthropic</option>
                    </select>
                    <input type="text" id="aiUrl" placeholder="API URL" value="https://api.openai.com/v1">
                    <input type="password" id="aiKey" placeholder="API Key">
                    <input type="text" id="aiQ" placeholder="问AI..." value="分析我的使用习惯">
                    <button onclick="askAI()">分析</button>
                    <div id="aiOutput" class="ai-output">等待分析...</div>
                </div>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="js/popup.js"></script>
</body>
</html>
