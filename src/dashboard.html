<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Habit DB - 数据分析</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: #0f0f1a;
            color: #e0e0e0;
            min-height: 100vh;
        }
        .header {
            background: linear-gradient(135deg, #1a1a3e, #2d2d6b);
            padding: 20px 30px;
            border-bottom: 2px solid #4a4aff;
        }
        .header h1 { color: #7b7bff; font-size: 24px; }
        .header p { color: #888; font-size: 14px; margin-top: 5px; }
        .container { max-width: 1400px; margin: 0 auto; padding: 30px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .card {
            background: rgba(26, 26, 62, 0.8);
            border: 1px solid rgba(74, 74, 255, 0.2);
            border-radius: 12px;
            padding: 20px;
        }
        .card h3 { color: #7b7bff; font-size: 16px; margin-bottom: 15px; }
        .stat-value { font-size: 36px; font-weight: bold; color: #7b7bff; }
        .stat-label { font-size: 13px; color: #888; }
        .chart-container { position: relative; height: 300px; }
        .ai-section {
            background: rgba(26, 26, 62, 0.8);
            border: 1px solid rgba(74, 74, 255, 0.2);
            border-radius: 12px;
            padding: 20px;
            margin-top: 30px;
        }
        .ai-input {
            width: 100%;
            padding: 12px;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(74,74,255,0.3);
            border-radius: 8px;
            color: #e0e0e0;
            font-size: 14px;
            margin-bottom: 10px;
        }
        .ai-output {
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(74,74,255,0.2);
            border-radius: 8px;
            padding: 15px;
            min-height: 100px;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 13px;
        }
        .btn {
            padding: 10px 20px;
            background: #4a4aff;
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }
        .btn:hover { background: #5b5bff; }
        .token-info {
            margin-top: 10px;
            padding: 10px;
            background: rgba(255,200,0,0.1);
            border-radius: 8px;
            font-size: 12px;
            color: #ffd600;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📊 数据分析仪表盘</h1>
        <p>查看所有记录的详细分析和总结</p>
    </div>

    <div class="container">
        <!-- 统计卡片 -->
        <div class="grid">
            <div class="card">
                <h3>📋 剪切板记录</h3>
                <div class="stat-value" id="statClipboard">0</div>
                <div class="stat-label">条记录</div>
            </div>
            <div class="card">
                <h3>🖥️ 窗口记录</h3>
                <div class="stat-value" id="statWindows">0</div>
                <div class="stat-label">条记录</div>
            </div>
            <div class="card">
                <h3>🔄 切换事件</h3>
                <div class="stat-value" id="statSwitches">0</div>
                <div class="stat-label">次切换</div>
            </div>
            <div class="card">
                <h3>📅 数据天数</h3>
                <div class="stat-value" id="statDays">0</div>
                <div class="stat-label">天</div>
            </div>
        </div>

        <!-- 图表 -->
        <div class="grid">
            <div class="card">
                <h3>📊 内容类型分布</h3>
                <div class="chart-container">
                    <canvas id="typeChart"></canvas>
                </div>
            </div>
            <div class="card">
                <h3>⏰ 每小时活动</h3>
                <div class="chart-container">
                    <canvas id="hourlyChart"></canvas>
                </div>
            </div>
        </div>

        <div class="grid">
            <div class="card">
                <h3>📈 每日趋势</h3>
                <div class="chart-container">
                    <canvas id="dailyChart"></canvas>
                </div>
            </div>
            <div class="card">
                <h3>🏆 应用排行</h3>
                <div class="chart-container">
                    <canvas id="appChart"></canvas>
                </div>
            </div>
        </div>

        <!-- AI 分析 -->
        <div class="ai-section">
            <h3>🤖 AI 智能分析</h3>
            <p style="color: #888; margin-bottom: 15px;">输入你的 API Key，让 AI 分析你的使用习惯</p>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px;">
                <input type="text" class="ai-input" id="apiUrl" placeholder="API URL (如 https://api.openai.com/v1)" value="https://api.openai.com/v1">
                <input type="password" class="ai-input" id="apiKey" placeholder="API Key">
            </div>

            <div style="display: grid; grid-template-columns: 1fr auto; gap: 10px; margin-bottom: 15px;">
                <input type="text" class="ai-input" id="aiQuestion" placeholder="问 AI 一个问题，如：分析我的工作习惯" value="请分析我的电脑使用习惯，给出效率建议">
                <button class="btn" onclick="askAI()">分析</button>
            </div>

            <div class="ai-output" id="aiOutput">等待分析...</div>
            <div class="token-info" id="tokenInfo" style="display: none;">
                Token 消耗: <span id="tokenCount">0</span> tokens
            </div>
        </div>
    </div>

    <script>
        const API = 'http://127.0.0.1:5001';

        // 加载数据
        async function loadData() {
            const [stats, clipboard, apps, hourly] = await Promise.all([
                fetch(`${API}/api/stats`).then(r => r.json()),
                fetch(`${API}/api/clipboard`).then(r => r.json()),
                fetch(`${API}/api/apps`).then(r => r.json()),
                fetch(`${API}/api/hourly`).then(r => r.json())
            ]);

            // 统计卡片
            document.getElementById('statClipboard').textContent = stats.total_clipboard;
            document.getElementById('statWindows').textContent = stats.total_windows;
            document.getElementById('statSwitches').textContent = stats.total_sessions;

            // 计算数据天数
            if (clipboard.length > 0) {
                const dates = [...new Set(clipboard.map(c => c.time?.split(' ')[0]))];
                document.getElementById('statDays').textContent = dates.length;
            }

            // 类型分布图
            const typeCounts = {};
            clipboard.forEach(c => {
                typeCounts[c.type] = (typeCounts[c.type] || 0) + 1;
            });

            new Chart(document.getElementById('typeChart'), {
                type: 'doughnut',
                data: {
                    labels: Object.keys(typeCounts),
                    datasets: [{
                        data: Object.values(typeCounts),
                        backgroundColor: ['#4a4aff', '#00c853', '#ffd600', '#ff1744', '#aa00ff']
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'bottom', labels: { color: '#888' } } }
                }
            });

            // 每小时活动图
            new Chart(document.getElementById('hourlyChart'), {
                type: 'bar',
                data: {
                    labels: hourly.map(h => `${h.hour}:00`),
                    datasets: [{
                        label: '活动次数',
                        data: hourly.map(h => h.count),
                        backgroundColor: 'rgba(74, 74, 255, 0.5)',
                        borderColor: 'rgba(74, 74, 255, 1)',
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.1)' }, ticks: { color: '#888' } },
                        x: { grid: { display: false }, ticks: { color: '#888' } }
                    }
                }
            });

            // 应用排行图
            new Chart(document.getElementById('appChart'), {
                type: 'bar',
                data: {
                    labels: apps.slice(0, 8).map(a => a.name.replace('.exe', '')),
                    datasets: [{
                        label: '使用时长(小时)',
                        data: apps.slice(0, 8).map(a => a.hours),
                        backgroundColor: 'rgba(0, 200, 83, 0.5)',
                        borderColor: 'rgba(0, 200, 83, 1)',
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    indexAxis: 'y',
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.1)' }, ticks: { color: '#888' } },
                        y: { grid: { display: false }, ticks: { color: '#888' } }
                    }
                }
            });
        }

        // AI 分析
        async function askAI() {
            const apiUrl = document.getElementById('apiUrl').value;
            const apiKey = document.getElementById('apiKey').value;
            const question = document.getElementById('aiQuestion').value;
            const output = document.getElementById('aiOutput');

            if (!apiKey) {
                output.textContent = '请先输入 API Key';
                return;
            }

            output.textContent = '正在分析...';

            // 获取数据摘要
            const [clipboard, apps, stats] = await Promise.all([
                fetch(`${API}/api/clipboard`).then(r => r.json()),
                fetch(`${API}/api/apps`).then(r => r.json()),
                fetch(`${API}/api/stats`).then(r => r.json())
            ]);

            // 构建上下文
            const context = `
用户电脑使用数据摘要:
- 剪切板记录: ${stats.total_clipboard} 条
- 窗口记录: ${stats.total_windows} 条
- 常用应用: ${apps.slice(0, 5).map(a => `${a.name}(${a.hours}小时)`).join(', ')}
- 最近复制: ${clipboard.slice(0, 5).map(c => c.preview?.substring(0, 50)).join('; ')}

用户问题: ${question}
`;

            try {
                const response = await fetch(`${apiUrl}/chat/completions`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: 'gpt-3.5-turbo',
                        messages: [
                            { role: 'system', content: '你是一个数据分析助手，帮助用户分析电脑使用习惯并给出建议。' },
                            { role: 'user', content: context }
                        ],
                        max_tokens: 1000
                    })
                });

                const data = await response.json();

                if (data.choices && data.choices[0]) {
                    output.textContent = data.choices[0].message.content;

                    // 显示 token 消耗
                    if (data.usage) {
                        document.getElementById('tokenInfo').style.display = 'block';
                        document.getElementById('tokenCount').textContent = data.usage.total_tokens;
                    }
                } else {
                    output.textContent = 'API 调用失败: ' + JSON.stringify(data);
                }
            } catch (e) {
                output.textContent = '错误: ' + e.message;
            }
        }

        // 加载数据
        loadData();
    </script>
</body>
</html>
